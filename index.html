<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urna dos Drinks</title>
  <link rel="stylesheet" href="style.css">
</head>
<audio id="som-urna" src="audio/urna-eletronica.mp3" preload="auto"></audio>
<body>
  <main class="urna">
    <section class="tela" id="tela-votante">
      <div class="conteudo">
        <h1>IDENTIFICAÇÃO</h1>
        <p class="subtitulo">Digite o número do candidato que está votando</p>

        <div class="display">
          <span id="display-votante"></span>
        </div>

        <div class="foto-area">
            <img id="foto-votante" src="" alt="Foto do votante">
            <strong id="nome-votante"></strong>
          </div>

        <div class="teclado">
          <button data-votante="1">1</button>
          <button data-votante="2">2</button>
          <button data-votante="3">3</button>
          <button data-votante="4">4</button>
          <button data-votante="5">5</button>
          <button data-votante="6">6</button>
          <button data-votante="7" disabled>7</button>
          <button data-votante="8" disabled>8</button>
          <button data-votante="9" disabled>9</button>
          <button class="tecla-zero" data-votante="0" disabled>0</button>
        </div>

        <div class="acoes">
          <button class="btn-branco" id="branco-votante">BRANCO</button>
          <button class="btn-corrige" id="corrige-votante">CORRIGE</button>
          <button class="btn-confirma" id="confirma-votante">CONFIRMA</button>
        </div>
      </div>
    </section>

    <section class="tela escondida" id="tela-candidato">
      <div class="conteudo">
        <h1>CANDIDATO</h1>
        <p class="subtitulo">Digite o número do drink que deseja avaliar</p>

        <div class="display">
          <span id="display-candidato"></span>
        </div>

        <div class="foto-area">
          <img id="foto-candidato" src="" alt="Foto do drink">
          <div>
            <strong id="nome-candidato"></strong>
          </div>
        </div>

        <div class="teclado">
          <button data-candidato="1">1</button>
          <button data-candidato="2">2</button>
          <button data-candidato="3">3</button>
          <button data-candidato="4">4</button>
          <button data-candidato="5">5</button>
          <button data-candidato="6">6</button>
          <button data-candidato="7" disabled>7</button>
          <button data-candidato="8" disabled>8</button>
          <button data-candidato="9" disabled>9</button>
          <button class="tecla-zero" data-candidato="0" disabled>0</button>
        </div>

        <div class="acoes">
          <button class="btn-branco" id="branco-candidato">BRANCO</button>
          <button class="btn-corrige" id="corrige-candidato">CORRIGE</button>
          <button class="btn-confirma" id="confirma-candidato">CONFIRMA</button>
        </div>

        <p class="aviso" id="aviso-candidato"></p>
      </div>
    </section>

    <section class="tela escondida" id="tela-criterio">
      <div class="conteudo">
        <h1 id="titulo-criterio">APRESENTAÇÃO</h1>
        <p class="subtitulo">Digite sua nota de 0 a 5</p>

        <div class="criterio-candidato">
          <span id="criterio-numero"></span>
          <strong id="criterio-nome"></strong>
        </div>

        <div class="display nota-display">
          <span id="display-nota"></span>
        </div>

        <div class="teclado notas">
          <button data-nota="1">1</button>
          <button data-nota="2">2</button>
          <button data-nota="3">3</button>
          <button data-nota="4">4</button>
          <button data-nota="5">5</button>
          <button data-nota="6" disabled>6</button>
          <button data-nota="7" disabled>7</button>
          <button data-nota="8" disabled>8</button>
          <button data-nota="9" disabled>9</button>
          <button data-nota="0">0</button>
        </div>

        <div class="acoes">
          <button class="btn-corrige" id="corrige-nota">CORRIGE</button>
          <button class="btn-confirma" id="confirma-nota">CONFIRMA</button>
        </div>

        <p class="aviso" id="aviso-nota"></p>
      </div>
    </section>

    <section class="tela escondida" id="tela-fim">
      <div class="fim">
        <h1>FIM</h1>
      </div>
    </section>

    <section class="tela escondida" id="tela-apuracao">

        <div class="apuracao">
      
          <h1>APURAÇÃO DOS VOTOS</h1>
      
          <div id="resultado-apuracao"></div>
      
          <div class="acoes-apuracao">
            <button id="voltar-votacao">
              VOLTAR
            </button>
          </div>
      
        </div>
      
      </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
